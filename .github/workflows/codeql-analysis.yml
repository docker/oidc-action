name: codeql

on:
  push:
    branches:
      - 'master'
      - 'releases/v*'
    paths:
      - 'codeql-analysis.yml'
      - 'dist/**'
      - 'src/**'
  pull_request:
    paths:
      - 'codeql-analysis.yml'
      - 'dist/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # 4.36.2
        with:
          languages: javascript-typescript
          config: |
            paths:
              - src
      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # 4.36.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # 4.36.2
        with:
          category: '/language:javascript-typescript'
